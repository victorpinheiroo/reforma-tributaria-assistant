[project]
name = "reforma-tributaria-assistant"
version = "0.1.0"
description = "Questions about Brazil's consumption tax reform (CBS, IBS, IS) answered with the legal article cited and amounts computed by the Federal Revenue's official open-source tax engine."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "databricks-sdk>=0.30",
    "mcp>=1.10",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "numpy>=2.4.6",
    "torch>=2.4",
    "langgraph>=1.2.24",
]

[project.scripts]
rtc-tools = "rtc.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# user-facing Portuguese sentences and prompt fragments read better unbroken
"src/rtc/graph.py" = ["E501"]
"tests/test_graph.py" = ["E501"]
"src/rtc/qa_eval.py" = ["E501"]
"src/rtc/verify.py" = ["E501"]
"tests/test_verify.py" = ["E501"]
"src/rtc/verify_eval.py" = ["E501"]

# CPU-only torch on Linux (CI, Docker): the default wheel ships CUDA and is several GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
