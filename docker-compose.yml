# docker compose up --build
#   calculadora  official Federal Revenue calculator 1.7.2 (Java 25), built from its public source
#   api          FastAPI on :8000. /v1/search and /v1/calculate need no account.
#   app          Streamlit on :8501
# /v1/ask (the agent) needs a model provider: DATABRICKS_HOST=... DATABRICKS_TOKEN=... docker compose up

services:
  calculadora:
    build:
      context: .
      dockerfile: docker/calculadora.Dockerfile
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS localhost:8080/api/calculadora/dados-abertos/versao || exit 1"]
      interval: 5s
      retries: 40

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      RTC_CALCULADORA_URL: http://calculadora:8080/api/calculadora
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    depends_on:
      calculadora:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 40

  app:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      retries: 20
